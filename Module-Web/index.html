<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EcoCampus – Tableau de bord énergétique</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="entete">
    <div>
      <h1>EcoCampus</h1>
      <p>Suivi de la consommation énergétique du campus</p>
    </div>
    <p id="maj" class="maj"></p>
  </header>

  <main>
    <section class="resume" aria-label="Résumé">
      <div class="kpi"><span id="kpi-mesures">–</span><small>mesures</small></div>
      <div class="kpi"><span id="kpi-batiments">–</span><small>bâtiments</small></div>
      <div class="kpi kpi-alerte"><span id="kpi-alertes">–</span><small>alertes</small></div>
    </section>

    <section class="filtres" aria-label="Filtres">
      <label>Recherche
        <input type="search" id="f-texte" placeholder="Nom du bâtiment">
      </label>
      <label>Bâtiment
        <select id="f-batiment"><option value="">Tous</option></select>
      </label>
      <label>Ressource
        <select id="f-type">
          <option value="">Toutes</option>
          <option value="electricite">Électricité</option>
          <option value="eau">Eau</option>
          <option value="gaz">Gaz</option>
        </select>
      </label>
      <label>Du <input type="date" id="f-debut"></label>
      <label>Au <input type="date" id="f-fin"></label>
      <label class="check"><input type="checkbox" id="f-alertes"> Alertes seulement</label>
      <button type="button" id="f-reset">Réinitialiser</button>
    </section>

    <p id="message" class="message" role="status"></p>
    <label id="choix-fichier" class="choix-fichier" hidden>
      Sélectionnez le fichier <strong>data.json</strong> :
      <input type="file" id="f-fichier" accept=".json,application/json">
    </label>

    <section aria-label="Bâtiments">
      <h2>Bâtiments</h2>
      <div id="cartes" class="cartes"></div>
    </section>

    <section aria-label="Graphique">
      <h2>Consommation par bâtiment</h2>
      <div class="graphique">
        <canvas id="graph" height="320"></canvas>
        <ul id="legende" class="legende"></ul>
      </div>
    </section>

    <section aria-label="Mesures">
      <h2>Détail des mesures</h2>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>N°</th><th>Bâtiment</th><th>Ressource</th><th>Date</th>
              <th class="num">Valeur</th><th class="num">Seuil</th><th>État</th>
            </tr>
          </thead>
          <tbody id="corps"></tbody>
        </table>
      </div>
    </section>
  </main>

  <footer class="pied">EcoCampus · DSI2 · 2026/2027</footer>
  <script src="script.js"></script>
</body>
</html>
